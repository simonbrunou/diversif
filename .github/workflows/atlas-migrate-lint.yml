name: Atlas migration lint

on:
  pull_request:
    paths:
      - 'drizzle/**'

jobs:
  atlas-lint:
    name: Lint drizzle/*.sql against real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ariga/setup-atlas@v0
      - name: Atlas migrate lint
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          atlas migrate lint \
            --dir 'file://drizzle?format=golang-migrate' \
            --dev-url 'postgres://postgres:postgres@localhost:5432/atlas_dev?sslmode=disable' \
            --base "origin/$BASE_REF" \
            --latest 0
