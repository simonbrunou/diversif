name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - name: Drizzle schema vs migration drift check
        run: bun --bun node_modules/drizzle-kit/bin.cjs check

  unit-and-component:
    name: Unit + component tests (bun test, 100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diversif
          POSTGRES_PASSWORD: diversif
          POSTGRES_DB: diversif_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diversif"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bun --bun node_modules/playwright/cli.js install --with-deps chromium
      - run: bun --bun node_modules/playwright/cli.js test
        env:
          CI: 'true'
          E2E_DATABASE_URL: postgres://diversif:diversif@localhost:5432/diversif_e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  bundle-budget:
    name: Bundle size budget
    runs-on: ubuntu-latest
    services:
      # The Vite build's prerender step renders +page.server.ts handlers
      # that touch the DB. A throwaway postgres lets the build succeed
      # without affecting the budget script (which only reads the JS /
      # static artifacts).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diversif
          POSTGRES_PASSWORD: diversif
          POSTGRES_DB: diversif_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diversif"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          DATABASE_URL: postgres://diversif:diversif@localhost:5432/diversif_e2e
      - run: bun scripts/check-bundle-size.ts
