name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - name: Drizzle schema vs migration drift check
        run: bun --bun node_modules/drizzle-kit/bin.cjs check

  unit-and-component:
    name: Unit + component tests (bun test, 100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bun --bun node_modules/playwright/cli.js install --with-deps chromium
      # The webServer (playwright.config.ts) boots against a throwaway SQLite
      # file at DATABASE_PATH and migrates/seeds on start — no DB service needed.
      - run: bun --bun node_modules/playwright/cli.js test
        env:
          CI: 'true'
          DATABASE_PATH: ${{ runner.temp }}/diversif-e2e.db
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  bundle-budget:
    name: Bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The build's prerender uses an in-memory SQLite stub (see
      # src/lib/server/db/index.ts: `building` -> :memory:), so no DB service
      # or DATABASE_PATH is needed at build time.
      - run: bun run build
      - run: bun scripts/check-bundle-size.ts
