name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - name: Drizzle schema vs migration drift check
        run: bun --bun node_modules/drizzle-kit/bin.cjs check

  boundaries:
    name: Architecture boundaries (server-in-client guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # dependency-cruiser resolves $lib/$app aliases through tsconfig.json,
      # which extends SvelteKit's generated .svelte-kit/tsconfig.json. Generate
      # paraglide messages + run `svelte-kit sync` first so those paths exist
      # and resolve, otherwise the cruise can't match `$lib/server/...` targets.
      - run: bun run paraglide
      - run: bun --bun node_modules/@sveltejs/kit/src/cli.js sync
      # Forbids any client-reachable module from importing the Drizzle client,
      # bun:sqlite, or $lib/server at runtime (type-only imports are allowed).
      # dependency-cruiser is a pinned devDependency, so this runs the local
      # binary — never invoke bare `depcruise` via bunx (dependency-confusion).
      - name: dependency-cruiser
        run: bun run depcruise

  knip:
    name: Knip (unused files/exports/deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # knip resolves $lib/$app aliases and skips generated output, so it needs
      # paraglide's messages + SvelteKit's synced tsconfig/$types present first.
      - run: bun run paraglide
      - run: bun --bun node_modules/@sveltejs/kit/src/cli.js sync
      - run: bun run knip

  fallow-audit:
    name: Fallow audit (changed-file health gate)
    # PR-only: the audit attributes findings to the PR's diff against its base
    # branch. On a direct push to main there is no base_ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so fallow can compute the merge-base with the base
          # branch and attribute findings to the changeset (the `new-only` gate
          # in .fallowrc.json fails only on issues this change introduces).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Generate paraglide messages + SvelteKit's tsconfig/$types so fallow can
      # resolve $lib / $app / ./$types aliases while analyzing changed files.
      - run: bun run paraglide
      - run: bun --bun node_modules/@sveltejs/kit/src/cli.js sync
      # fallow is a pinned devDependency, installed above via frozen-lockfile,
      # so this runs the cached local binary — no registry fetch at audit time
      # (a yanked version or npm outage can't break the gate). Bump via Renovate.
      # Use --format sarif to feed GitHub code scanning if desired.
      # FALLOW_AUDIT_BASE pins the diff base to the PR target: without it,
      # fallow resolves the base to the branch's own upstream (the PR head),
      # yielding 0 changed files and a vacuous pass.
      - name: Fallow audit
        run: node_modules/.bin/fallow audit --format compact
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}

  unit-and-component:
    name: Unit + component tests (bun test, 100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bun run test:e2e:install
      # The webServer (playwright.config.ts) boots against a throwaway SQLite
      # file at DATABASE_PATH and migrates/seeds on start — no DB service needed.
      - run: bun run test:e2e
        env:
          CI: 'true'
          DATABASE_PATH: ${{ runner.temp }}/diversif-e2e.db
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  bundle-budget:
    name: Bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The build's prerender uses an in-memory SQLite stub (see
      # src/lib/server/db/index.ts: `building` -> :memory:), so no DB service
      # or DATABASE_PATH is needed at build time.
      - run: bun run check:budget

  db-backup-verify:
    name: Backup restore verification (db:verify-backup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Bootstrap a real database the same way the app does on boot: start the
      # production entrypoint against a throwaway file and wait for /healthz.
      # migrate() + seedFoods() run synchronously while src/lib/server/db/
      # index.ts is imported (see that file), so a healthy response means the
      # file is already migrated and seeded. Stop the server once healthy —
      # kept as its own step, separate from the verify step below, so
      # db:verify-backup exercises a database file produced exactly the way
      # the production backup/restore path would see it, not a hand-rolled
      # fixture built by this workflow.
      - name: Bootstrap a real database (migrate + seed)
        run: |
          set -e
          PORT=3100 HOST=127.0.0.1 ORIGIN=http://127.0.0.1:3100 \
            DATABASE_PATH="${{ runner.temp }}/diversif-backup-verify.db" \
            bun build/index.js &
          BOOT_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/healthz > /dev/null; then
              echo "Server healthy after ${i}s"
              kill "$BOOT_PID"
              wait "$BOOT_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy" >&2
          kill "$BOOT_PID" 2>/dev/null || true
          exit 1
      - name: Verify the backup/restore path
        run: bun run db:verify-backup
        env:
          DATABASE_PATH: ${{ runner.temp }}/diversif-backup-verify.db

  docker-build:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # No push, just proves the image still builds — the runtime stage has
      # broken before (missing patches/ dir, see Dockerfile) with nothing in
      # CI to catch it.
      - run: docker build --tag diversif:ci-smoke .

  bun-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # Two tiers, both currently floored at `critical` — see the comment on
      # each step for why neither can sit at a stricter level today, and what
      # has to happen upstream before it ratchets down.
      #
      # `bun audit` has no built-in prod/dev split (verified against this
      # exact bun version's `--help`: only --json, --audit-level, --ignore
      # exist) and always reads the full lockfile regardless of what's
      # actually installed in node_modules — a `--production` install does
      # NOT scope it. The production-only step below works around that by
      # auditing a from-scratch install of a package.json with
      # devDependencies stripped, so only the packages that really end up in
      # the Docker runtime image's node_modules (see Dockerfile's prod-deps
      # stage) are considered.
      - name: Production dependencies (strict — ships in the runtime image)
        run: |
          set -e
          mkdir -p /tmp/prod-audit
          bun -e "
            const pkg = require('./package.json');
            delete pkg.devDependencies;
            require('fs').writeFileSync('/tmp/prod-audit/package.json', JSON.stringify(pkg));
          "
          cd /tmp/prod-audit
          bun install --ignore-scripts
          # Floor is `critical`, not `high`, because @sentry/sveltekit (a real
          # production dependency) declares @sentry/vite-plugin as a hard
          # `dependency` rather than a devDependency/optionalDependency
          # upstream, so it ships in prod-deps' node_modules even though
          # nothing at runtime imports it — grep confirms `sentryVitePlugin`
          # is only ever imported from vite.config.ts, a build-time-only
          # file never bundled into build/index.js. That pulls in
          # brace-expansion (high ×3) and browserslist (high ×2) +
          # baseline-browser-mapping (moderate) transitively. This is a
          # floor to ratchet DOWN to `high` once @sentry/sveltekit stops
          # requiring @sentry/vite-plugin as a hard dependency, or those
          # packages fix themselves — re-run this step's audit locally after
          # any @sentry/sveltekit bump to check.
          bun audit --audit-level=critical
      - name: All dependencies (dev + build tooling included)
        run: |
          set -e
          bun install --frozen-lockfile
          # Floor is `critical`, not `high`, because eslint / vite /
          # @sentry/vite-plugin / @vite-pwa/sveltekit's own transitive pins
          # of brace-expansion, nanoid, postcss, postcss-selector-parser,
          # fast-uri and browserslist are behind upstream fixes (see #317 —
          # already at each tool's latest release; nothing left for us to
          # bump). This is a floor to ratchet DOWN to `high` once those
          # tools repin — re-run `bun audit --audit-level=high` after any
          # `bun update` to check whether the noise floor has shrunk, and
          # tighten this step the day it passes.
          bun audit --audit-level=critical
