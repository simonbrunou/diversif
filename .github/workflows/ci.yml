name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - name: Drizzle schema vs migration drift check
        run: bun --bun node_modules/drizzle-kit/bin.cjs check

  boundaries:
    name: Architecture boundaries (server-in-client guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # dependency-cruiser resolves $lib/$app aliases through tsconfig.json,
      # which extends SvelteKit's generated .svelte-kit/tsconfig.json. Generate
      # paraglide messages + run `svelte-kit sync` first so those paths exist
      # and resolve, otherwise the cruise can't match `$lib/server/...` targets.
      - run: bun run paraglide
      - run: bun --bun node_modules/@sveltejs/kit/src/cli.js sync
      # Forbids any client-reachable module from importing the Drizzle client,
      # bun:sqlite, or $lib/server at runtime (type-only imports are allowed).
      # dependency-cruiser is a pinned devDependency, so this runs the local
      # binary — never invoke bare `depcruise` via bunx (dependency-confusion).
      - name: dependency-cruiser
        run: bun run depcruise

  fallow-audit:
    name: Fallow audit (changed-file health gate)
    # PR-only: the audit attributes findings to the PR's diff against its base
    # branch. On a direct push to main there is no base_ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so fallow can compute the merge-base with the base
          # branch and attribute findings to the changeset (the `new-only` gate
          # in .fallowrc.json fails only on issues this change introduces).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Generate paraglide messages + SvelteKit's tsconfig/$types so fallow can
      # resolve $lib / $app / ./$types aliases while analyzing changed files.
      - run: bun run paraglide
      - run: bun --bun node_modules/@sveltejs/kit/src/cli.js sync
      # fallow is a pinned devDependency, installed above via frozen-lockfile,
      # so this runs the cached local binary — no registry fetch at audit time
      # (a yanked version or npm outage can't break the gate). Bump via Renovate.
      # Use --format sarif to feed GitHub code scanning if desired.
      # FALLOW_AUDIT_BASE pins the diff base to the PR target: without it,
      # fallow resolves the base to the branch's own upstream (the PR head),
      # yielding 0 changed files and a vacuous pass.
      - name: Fallow audit
        run: node_modules/.bin/fallow audit --format compact
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}

  unit-and-component:
    name: Unit + component tests (bun test, 100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bun --bun node_modules/playwright/cli.js install --with-deps chromium
      # The webServer (playwright.config.ts) boots against a throwaway SQLite
      # file at DATABASE_PATH and migrates/seeds on start — no DB service needed.
      - run: bun --bun node_modules/playwright/cli.js test
        env:
          CI: 'true'
          DATABASE_PATH: ${{ runner.temp }}/diversif-e2e.db
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  bundle-budget:
    name: Bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The build's prerender uses an in-memory SQLite stub (see
      # src/lib/server/db/index.ts: `building` -> :memory:), so no DB service
      # or DATABASE_PATH is needed at build time.
      - run: bun run build
      - run: bun scripts/check-bundle-size.ts
