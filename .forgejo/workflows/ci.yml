# Runs on the self-hosted Forgejo (git.sbrn.eu), the source of truth; the GitHub
# repository is a push mirror and runs no CI. Differences from the GitHub-hosted
# version: artifacts use Forgejo's upload-artifact fork (actions/upload-artifact
# v4+ refuses to run off github.com), and the docker-build job talks to the
# runner CT's Docker daemon, which shares nothing with the job's filesystem.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # CI's bun-version inputs, railpack.json (production) and the
      # Dockerfile's oven/bun tags must read one Bun (#528). The script's
      # header lists what it reads.
      - name: One Bun version in CI, production and the Docker image
        run: scripts/check-bun-pins.sh
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - name: Drizzle schema vs migration drift check
        run: bun --bun node_modules/drizzle-kit/bin.cjs check

  boundaries:
    name: Architecture boundaries (server-in-client guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # dependency-cruiser resolves #lib through package.json `imports` and
      # SvelteKit's types through tsconfig.json, which extends the generated
      # $app/tsconfig. Generate paraglide messages + run `svelte-kit sync`
      # first so those files exist and resolve, otherwise the cruise can't
      # match `#lib/server/...` targets.
      - run: bun run paraglide
      - run: bun --bun node_modules/@sveltejs/kit/src/cli.js sync
      # Forbids any client-reachable module from importing the Drizzle client,
      # bun:sqlite, or #lib/server at runtime (type-only imports are allowed).
      # dependency-cruiser is a pinned devDependency, so this runs the local
      # binary — never invoke bare `depcruise` via bunx (dependency-confusion).
      - name: dependency-cruiser
        run: bun run depcruise

  knip:
    name: Knip (unused files/exports/deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # knip resolves #lib/$app imports and skips generated output, so it needs
      # paraglide's messages + SvelteKit's synced tsconfig/$types present first.
      - run: bun run paraglide
      - run: bun --bun node_modules/@sveltejs/kit/src/cli.js sync
      - run: bun run knip

  fallow-audit:
    name: Fallow audit (changed-file health gate)
    # PR-only: the audit attributes findings to the PR's diff against its base
    # branch. On a direct push to main there is no base_ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so fallow can compute the merge-base with the base
          # branch and attribute findings to the changeset (the `new-only` gate
          # in .fallowrc.json fails only on issues this change introduces).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Generate paraglide messages + SvelteKit's tsconfig/$types so fallow can
      # resolve #lib / $app / ./$types imports while analyzing changed files.
      - run: bun run paraglide
      - run: bun --bun node_modules/@sveltejs/kit/src/cli.js sync
      # fallow is a pinned devDependency, installed above via frozen-lockfile,
      # so this runs the cached local binary — no registry fetch at audit time
      # (a yanked version or npm outage can't break the gate). Bump via Renovate.
      # Use --format sarif to feed GitHub code scanning if desired.
      # FALLOW_AUDIT_BASE pins the diff base to the PR target: without it,
      # fallow resolves the base to the branch's own upstream (the PR head),
      # yielding 0 changed files and a vacuous pass.
      - name: Fallow audit
        run: node_modules/.bin/fallow audit --format compact
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}

  unit-and-component:
    name: Unit + component tests (bun test, 100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: coverage
          path: coverage
          retention-days: 14

  # Tells the e2e job whether a PR's change reaches the app. A PR that changes
  # only Markdown files and docs/ skips E2E: nothing the app builds or the E2E
  # tests run reads those paths. A push to main always runs it. See
  # scripts/e2e-needed.sh for both.
  changes:
    name: Changed paths (E2E needed?)
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      # A push to main needs no checkout: its step prints true.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, for the merge base of a PR with its base branch.
          fetch-depth: 0
      - id: paths
        name: Decide whether E2E runs
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            e2e="$(scripts/e2e-needed.sh "origin/$BASE_REF")"
            echo "E2E needed: $e2e (the branch's changes since origin/$BASE_REF)"
          else
            e2e=true
            echo "E2E needed: true (a push to main)"
          fi
          echo "e2e=$e2e" >>"$GITHUB_OUTPUT"

  e2e:
    name: End-to-end tests (Playwright)
    needs: changes
    # Skipped when changes printed false. A failed changes job turns the run
    # red and skips E2E too: rerun the whole run.
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bun run test:e2e:install
      # The webServer (playwright.config.ts) boots against a throwaway SQLite
      # file at DATABASE_PATH and migrates/seeds on start — no DB service needed.
      - run: bun run test:e2e
        env:
          CI: 'true'
          DATABASE_PATH: ${{ runner.temp }}/diversif-e2e.db
      - name: Upload Playwright report
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  bundle-budget:
    name: Bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The build's prerender uses an in-memory SQLite stub (see
      # src/lib/server/db/index.ts: `building` -> :memory:), so no DB service
      # or DATABASE_PATH is needed at build time.
      - run: bun run check:budget

  db-backup-verify:
    name: Backup restore verification (db:verify-backup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Bootstrap a real database the same way the app does on boot: start the
      # production entrypoint against a throwaway file and wait for /healthz.
      # migrate() + seedFoods() run synchronously while src/lib/server/db/
      # index.ts is imported (see that file), so a healthy response means the
      # file is already migrated and seeded. Stop the server once healthy —
      # kept as its own step, separate from the verify step below, so
      # db:verify-backup exercises a database file produced exactly the way
      # the production backup/restore path would see it, not a hand-rolled
      # fixture built by this workflow.
      - name: Bootstrap a real database (migrate + seed)
        run: |
          set -e
          PORT=3100 HOST=127.0.0.1 \
            DATABASE_PATH="${{ runner.temp }}/diversif-backup-verify.db" \
            bun build/index.js &
          BOOT_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/healthz > /dev/null; then
              echo "Server healthy after ${i}s"
              kill "$BOOT_PID"
              wait "$BOOT_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy" >&2
          kill "$BOOT_PID" 2>/dev/null || true
          exit 1
      - name: Verify the backup/restore path
        run: bun run db:verify-backup
        env:
          DATABASE_PATH: ${{ runner.temp }}/diversif-backup-verify.db

  docker-build:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    env:
      # The job drives the runner CT's Docker daemon, shared by every job on the
      # runner. Names carry the run id so two concurrent runs never collide, and
      # the attempt so a re-run never shares them with an earlier attempt of its
      # run (#697). An attempt the runner lost runs no cleanup step and leaves
      # its container, volume and image behind: the re-run's docker run would
      # then fail on the name, or mount the earlier attempt's database. An
      # attempt cut off from the forge can still be running when the re-run
      # starts, and with one name per run its cleanup step would remove the
      # re-run's container, volume and image. Forgejo numbers run_attempt per
      # job, not per run: re-running only this job makes it 2 while the other
      # jobs stay at 1.
      SMOKE_IMAGE: diversif:ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_CONTAINER: diversif-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_VOLUME: diversif-smoke-data-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # #697: remove what earlier attempts of this run left behind, by name. The
      # names are this attempt's with its number swapped out. Each check matches
      # the exact name: Docker's name filter matches a substring, so attempt 1's
      # check would also list attempt 10's. The container goes before its
      # volume, since Docker refuses to remove a volume that a container still
      # mounts, stopped or not. The image goes by tag, never by ID: a push run
      # and a pull_request run of one SHA build the same image ID. Each rm keeps
      # --force, which exits 0 on a name an earlier attempt's own cleanup step
      # removed after the check. `shell: bash` runs the text as
      # `bash --noprofile --norc -e -o pipefail`, so a failed docker call fails
      # the step once the ERR trap has named the attempt, and the for loop and
      # the trap need bash. scripts/ci-smoke-attempt.test.ts runs this text
      # against a stub docker.
      - name: Remove earlier attempts' container, volume and image
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$RUN_ATTEMPT" in
            '' | 0* | *[!0-9]*)
              echo "::error::github.run_attempt is '$RUN_ATTEMPT', not a positive integer, so the smoke container, volume and image names do not tell this run's attempts apart"
              exit 1
              ;;
          esac
          container_base=${SMOKE_CONTAINER%-"$RUN_ATTEMPT"}
          volume_base=${SMOKE_VOLUME%-"$RUN_ATTEMPT"}
          image_base=${SMOKE_IMAGE%-"$RUN_ATTEMPT"}
          if [ "$container_base" = "$SMOKE_CONTAINER" ] || [ "$volume_base" = "$SMOKE_VOLUME" ] || [ "$image_base" = "$SMOKE_IMAGE" ]; then
            echo "::error::SMOKE_CONTAINER ($SMOKE_CONTAINER), SMOKE_VOLUME ($SMOKE_VOLUME) and SMOKE_IMAGE ($SMOKE_IMAGE) must all end in -$RUN_ATTEMPT"
            exit 1
          fi
          if [ "$RUN_ATTEMPT" = 1 ]; then
            echo "This is attempt 1: no earlier attempt to clean up"
          fi
          trap 'echo "::error::a docker call failed while removing what attempt $n of this run left"' ERR
          for ((n = 1; n < RUN_ATTEMPT; n++)); do
            container="$container_base-$n"
            volume="$volume_base-$n"
            image="$image_base-$n"
            found=$(docker ps --all --quiet --filter "name=^/$container\$")
            if [ -n "$found" ]; then
              docker rm --force "$container" >/dev/null
              container_state=removed
            else
              container_state=absent
            fi
            found=$(docker volume ls --quiet --filter "name=^$volume\$")
            if [ -n "$found" ]; then
              docker volume rm --force "$volume" >/dev/null
              volume_state=removed
            else
              volume_state=absent
            fi
            found=$(docker images --quiet "$image")
            if [ -n "$found" ]; then
              docker image rm --force "$image" >/dev/null
              image_state=removed
            else
              image_state=absent
            fi
            echo "Attempt $n: container $container $container_state, volume $volume $volume_state, image $image $image_state"
          done
      # No push, just proves the image still builds — the runtime stage has
      # broken before (missing patches/ dir, see Dockerfile) with nothing in
      # CI to catch it.
      - run: docker build --tag "$SMOKE_IMAGE" .
      # No proxy env vars needed: PROTOCOL_HEADER/HOST_HEADER are baked into
      # the image but adapter-node falls back to the plain `host` header and
      # https when a request lacks them (@sveltejs/adapter-node handler.js),
      # and ADDRESS_HEADER — the one that throws when configured but
      # missing from a request — is deliberately NOT baked in. DATABASE_PATH
      # and WEBAUTHN_RP_ID are also baked in, so the container boots, runs
      # migrate() + seedFoods(), and answers /healthz with zero extra config.
      - name: Start the built image against a throwaway data volume
        # A fresh named volume, not a bind mount: the daemon cannot see the job's
        # runner.temp. A new volume inherits /app/data's ownership from the image
        # (uid 1001, see Dockerfile), so it is writable without a chmod. The
        # echo puts the attempt's names in the job log.
        run: |
          echo "Starting container $SMOKE_CONTAINER from image $SMOKE_IMAGE on volume $SMOKE_VOLUME"
          docker run -d --name "$SMOKE_CONTAINER" -v "$SMOKE_VOLUME:/app/data" "$SMOKE_IMAGE"
      # Bounded at 90s (18 x 5s): well past start-period=20s + interval=30s
      # (Dockerfile HEALTHCHECK), so a container that never migrates/boots
      # cleanly fails the job instead of the workflow hanging on it.
      - name: Wait for the container to report healthy
        run: |
          set -e
          for i in $(seq 1 18); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$SMOKE_CONTAINER")"
            echo "health status: ${status} ($((i * 5))s elapsed)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Container reported unhealthy" >&2
              docker logs "$SMOKE_CONTAINER" >&2
              docker inspect --format '{{json .State.Health}}' "$SMOKE_CONTAINER" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Container never became healthy within 90s" >&2
          docker logs "$SMOKE_CONTAINER" >&2
          docker inspect --format '{{json .State.Health}}' "$SMOKE_CONTAINER" >&2
          exit 1
      # Proves #371's fix: the runtime image ships the operator scripts
      # README/DEPLOY.md tell operators to run in-container, against a DB
      # that migrate()/seedFoods() already migrated + seeded on boot.
      - name: Run the operator scripts inside the running container
        run: |
          set -e
          docker exec "$SMOKE_CONTAINER" bun scripts/cleanup.ts
          docker exec "$SMOKE_CONTAINER" bun run db:verify-backup
      # The RGPD export ships as a bundle (`bun run build` → build/scripts/),
      # not as a copied source file: prove the bundle loads with no src/ or
      # devDependencies, reads the migrated schema read-only, and keeps its
      # exit codes. The user row is seeded here; boot only seeds foods.
      - name: Run the RGPD export inside the running container
        run: |
          set -e
          docker exec "$SMOKE_CONTAINER" bun -e '
            import { Database } from "bun:sqlite";
            new Database(process.env.DATABASE_PATH)
              .query("INSERT INTO users (email, password_hash, display_name, created_at) VALUES (?, ?, ?, ?)")
              .run("smoke@example.com", "x", "Smoke", Date.now());
          '
          out="$(docker exec "$SMOKE_CONTAINER" bun build/scripts/export-user.js SMOKE@example.com)"
          case "$out" in
            *'"email": "smoke@example.com"'*) ;;
            *) printf 'Unexpected export output:\n%s\n' "$out" >&2; exit 1 ;;
          esac
          status=0
          docker exec "$SMOKE_CONTAINER" bun build/scripts/export-user.js nobody@example.com || status=$?
          test "$status" -eq 2
      - name: Stop and remove the smoke container, volume and image
        if: always()
        run: |
          docker rm -f "$SMOKE_CONTAINER" || true
          docker volume rm -f "$SMOKE_VOLUME" || true
          docker image rm -f "$SMOKE_IMAGE" || true

  bun-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Two scopes: production dependencies only, the set both production
      # images install (the Dockerfile's runtime image, and the Railpack
      # image Coolify deploys through its prune step, #529), and all
      # dependencies (production + dev/build tooling). The images install
      # from bun.lock, which also gives them eslint and typescript as
      # optional peers of production packages; only the all scope installs
      # and audits those two (scripts/audit-deps.sh header). Both
      # are set to `high` — the tightest level either scope actually needs
      # today, since the
      # `overrides` block in package.json forces a transitive package onto a
      # patched release when its parent hasn't repinned yet. The commit that
      # added each override says why; `git log -G'"<name>":' --
      # package.json` lists it, along with later bumps and any change to a
      # dependency of the same name. `bun audit` was clean (0 findings) on
      # both scopes even at `--audit-level=low` when this gate went in
      # (#349) — `high` leaves headroom for low/moderate advisories in
      # dev-only tooling that don't block a release, while still catching
      # anything that actually matters. If a future advisory can't be
      # cleared by an override (no fixed release yet, or an override that
      # breaks the build), that's the trigger to raise a tier's threshold
      # back up — name the specific package and reason in the commit that
      # changes the override or the threshold, not by lowering this
      # comment's confidence silently.
      #
      # `brace-expansion` is deliberately not overridden: forcing one major
      # onto every consumer broke the ones that need another (it once
      # collapsed the old PWA precache manifest to ~1 entry with only a
      # swallowed build warning). `bun audit fix` keeps each copy on a
      # patched release, and this `--audit-level=high` gate catches any
      # that falls behind. Re-add it only after checking in bun.lock that
      # every copy still resolves to a version its consumer accepts.
      #
      # Both steps run scripts/audit-deps.sh, one scope each. Its header says
      # how each scope installs; run it with no argument to check both locally.
      #
      # Note: @sentry/sveltekit (a real production dependency) declares
      # @sentry/bundler-plugins as a hard `dependency` rather than a
      # devDependency/optionalDependency upstream, so it ships in
      # prod-deps' node_modules even though nothing at runtime imports it —
      # only vite.config.ts uses it (through `sentrySvelteKit` and
      # `@sentry/bundler-plugins/core`), a build-time-only file never
      # bundled into build/index.js. It pulls in brace-expansion
      # transitively (glob → minimatch); harmless dead weight, but worth
      # knowing why it's there if `bun audit` ever flags that chain.
      - name: Production dependencies only
        run: scripts/audit-deps.sh production
      - name: All dependencies (dev + build tooling included)
        run: scripts/audit-deps.sh all
