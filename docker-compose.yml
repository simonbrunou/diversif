# Local development / self-hosting example.
#
# Coolify (production) mounts a persistent volume at /app/data and sets
# DATABASE_PATH; production deploys do NOT use this file.
# Run `docker compose up` to bring up the app with a local SQLite volume.
name: diversif-local

services:
  app:
    build: .
    container_name: diversif-app
    ports:
      - '3000:3000'
    environment:
      ORIGIN: http://localhost:3000
      WEBAUTHN_RP_ID: localhost
      DATABASE_PATH: /app/data/diversif.db
      NODE_ENV: development
      BODY_SIZE_LIMIT: 65536
    volumes:
      # SQLite lives on a named volume so it survives `docker compose down`
      # (without -v) and image rebuilds. Losing this volume loses all data.
      - data:/app/data

  litestream:
    # Off-box continuous backup sidecar for DEPLOY.md "B1". SCAFFOLDED, NOT
    # DEPLOYED: it only starts with the `backup` profile
    # (`docker compose --profile backup up`) once the LITESTREAM_* variables
    # below point at a real S3-compatible bucket (Cloudflare R2 recommended)
    # — see DEPLOY.md B1 for the setup steps. Ordinary `docker compose up`
    # for local dev is unaffected.
    image: litestream/litestream:0.5.17
    profiles: [backup]
    container_name: diversif-litestream
    command: replicate
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/diversif.db
      # Defaults are blank on purpose: Compose interpolates every service's
      # variables up front even when its profile isn't active, so a hard
      # `:?required` here would break plain `docker compose up` (no
      # `--profile backup`) for everyone, not just people enabling backups.
      # Litestream itself fails loudly (see its container logs) if it
      # actually runs with these unset — set real values in a `.env` file
      # or the shell environment before using `--profile backup`.
      LITESTREAM_S3_ENDPOINT: ${LITESTREAM_S3_ENDPOINT:-}
      LITESTREAM_S3_BUCKET: ${LITESTREAM_S3_BUCKET:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - data:/app/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - app

volumes:
  data:
