services:
  diversif:
    build: .
    container_name: diversif
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - diversif-data:/app/data
    environment:
      - ORIGIN=https://diversif.app
      - DATABASE_PATH=/app/data/diversif.db
      - NODE_ENV=production

volumes:
  diversif-data:
    name: diversif-data
