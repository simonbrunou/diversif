services:
  diversif:
    build: .
    container_name: diversif
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - diversif-data:/app/data
    environment:
      - ORIGIN=${ORIGIN:?ORIGIN must be set in .env}
      - DATABASE_PATH=/app/data/diversif.db
      - NODE_ENV=production
    mem_limit: 512m
    mem_reservation: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  diversif-data:
    name: diversif-data
