<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="%sveltekit.assets%/icons/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/icons/icon-512.png"
      type="image/png"
      sizes="512x512"
    />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#6b8e6b" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6b8e6b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a221d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
    <title>Diversif — Diversification alimentaire bébé</title>
    %sveltekit.head%
    <!-- Loaded AFTER %sveltekit.head% so SvelteKit's CSP meta tag is parsed
         first and this script runs under the policy. Synchronous script in
         <head> still executes before <body> is parsed, avoiding a theme flash. -->
    <script src="%sveltekit.assets%/theme-init.js"></script>
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-background text-foreground antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
