<!doctype html>
<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="%sveltekit.assets%/icons/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/icons/icon-512.png"
      type="image/png"
      sizes="512x512"
    />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#6b8e6b" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6b8e6b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/icons/apple-touch-icon-180.png"
    />
    <link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Diversif · Diversification alimentaire bébé</title>
    %sveltekit.head%
    <!-- Inlined (was static/theme-init.js) to drop one render-blocking request
         on the LCP critical path. Sync script in <head> runs before <body> is
         parsed, avoiding a theme flash. SvelteKit's hash-mode CSP does NOT
         scan static app.html scripts : this block's hash is hardcoded in
         svelte.config.js `script-src`. If you edit it, recompute per the
         instructions in svelte.config.js or the script silently fails. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-background text-foreground antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
