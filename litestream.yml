# Litestream replication config — SCAFFOLDED, NOT YET DEPLOYED.
#
# Closes DEPLOY.md "B1 — Off-box, continuous backups": streams the SQLite
# WAL to an S3-compatible bucket (Cloudflare R2 is the intended target) for
# point-in-time recovery, on top of the existing manual pre-deploy
# `VACUUM INTO` snapshot. WAL mode is already enabled
# (src/lib/server/db/index.ts) — Litestream's only prerequisite.
#
# No real credentials belong in this file or in git: every value below is
# read from the environment (Litestream expands ${VAR} at load time).
# Compose will not stop you when one is unset — it defaults them to blank
# on purpose (see docker-compose.yml) so a plain `docker compose up` without
# --profile backup is unaffected — but Litestream itself fails loudly: a
# blank bucket makes it exit with "bucket required for s3 replica" (a
# restart loop under `restart: unless-stopped`), and an unset DATABASE_PATH
# leaves it logging "sync error … unable to open database file" every
# second while replicating nothing. Check the sidecar's logs, then confirm
# replication with DEPLOY.md's "Verify replication is actually happening"
# step (`litestream databases` / `litestream generations`) — see DEPLOY.md
# B1 for the R2 bucket + API token setup.

dbs:
  - path: ${DATABASE_PATH}
    replicas:
      - type: s3
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        bucket: ${LITESTREAM_S3_BUCKET}
        path: diversif
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
