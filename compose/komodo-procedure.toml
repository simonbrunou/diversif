# Komodo Procedure — rolling deploy for the diversif-a / diversif-b
# stack pair. Drop this into Komodo's Resource Sync (or recreate the
# equivalent in the UI) and trigger via the build webhook.
#
# Each stage runs sequentially; executions inside a stage run in
# parallel. Putting the two DeployStack calls in *separate* stages is
# what gives us rolling behaviour — diversif-a is recreated first while
# diversif-b keeps serving via Traefik, then diversif-b is recreated
# while diversif-a (now on the new image) serves.
#
# Prerequisites:
#   - Stacks `diversif-a` and `diversif-b` are registered in Komodo,
#     pointing to compose/diversif-a.yaml and compose/diversif-b.yaml.
#   - Both stacks have `auto_update = false` (otherwise they'd
#     redeploy in parallel on a new image digest, defeating the roll).
#   - The build that produces the new image fires this Procedure via
#     webhook on success.

[[procedure]]
name = "diversif-rolling-deploy"
description = "Rolling deploy: redeploy slot A, then slot B."

[[procedure.config.stage]]
name = "Deploy slot A"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "diversif-a" },
]

[[procedure.config.stage]]
name = "Deploy slot B"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "diversif-b" },
]
