# Diversif slot B — sibling of diversif-a.yaml. See that file for the
# full design. Identical service definition; only the stack name and
# container_name differ. Both register the same Traefik router so
# requests are load-balanced across whichever slots are healthy.

name: diversif-b

services:
  app:
    image: ${IMAGE:?IMAGE required}
    container_name: diversif-b
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - ORIGIN=${ORIGIN:?ORIGIN required}
      - DATABASE_PATH=/app/data/diversif.db
      - NODE_ENV=production
      - BODY_SIZE_LIMIT=65536
    volumes:
      - data:/app/data
    networks:
      - traefik-web
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-web'
      - 'traefik.http.routers.diversif.rule=Host(`${DOMAIN:?DOMAIN required}`)'
      - 'traefik.http.routers.diversif.entrypoints=websecure'
      - 'traefik.http.routers.diversif.tls.certresolver=le'
      - 'traefik.http.services.diversif.loadbalancer.server.port=3000'
      - 'traefik.http.services.diversif.loadbalancer.healthcheck.path=/healthz'
      - 'traefik.http.services.diversif.loadbalancer.healthcheck.interval=5s'
      - 'traefik.http.services.diversif.loadbalancer.healthcheck.timeout=2s'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  data:
    name: diversif-data
    external: true

networks:
  traefik-web:
    name: traefik-web
    external: true
