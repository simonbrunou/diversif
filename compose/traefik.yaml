# Traefik — host-level reverse proxy for the diversif-a/b zero-downtime pair.
# Runs HTTP-only on :80; TLS is terminated upstream at the Cloudflare edge,
# cloudflared on CT 201 forwards plain HTTP into this Traefik. So no LE,
# no certs volume, no public 443.
#
# After this stack is running, point the cloudflared ingress for diversif.app
# at http://192.168.1.55:80 (replacing the current :3000 route).

name: traefik

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=traefik-web'
      - '--entrypoints.web.address=:80'
      - '--ping=true'
      - '--ping.entryPoint=web'
      # - '--api.dashboard=true'
    networks:
      - traefik-web
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/ping']
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  traefik-web:
    name: traefik-web
